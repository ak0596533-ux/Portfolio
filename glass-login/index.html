<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glass Login | Ankit Kumar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <form id="loginForm" class="login-box">

            <h1>Welcome Back</h1>
            <p>Login to access my portfolio</p>

            <div class="input-box">
                <input
                    type="email"
                    id="email"
                    placeholder="Email"
                    required
                >
            </div>

            <div class="input-box password-box">
                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button
                    type="button"
                    id="togglePassword"
                    class="toggle-password"
                >
                    👁
                </button>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <p id="message"></p>

        </form>

    </div>

    <script src="script.js"></script>

</body>
</html>
